name: Restore navigation persistence safely

on:
  push:
    paths:
      - '.github/workflows/restore-navigation-persistence.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply navigation persistence only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/App.tsx')
          text = path.read_text()

          helper = '''function readStoredNavigationState(): {\n  stack: Screen[]\n  activeConversationId: number | null\n  activeDocumentId: number | null\n  activeGroupId: number | null\n  activeProfileUserId: number | null\n  activeOpportunityId: number | null\n} | null {\n  try {\n    const raw = sessionStorage.getItem('prepza-navigation-state')\n    if (!raw) return null\n    const value = JSON.parse(raw)\n    if (!value || !Array.isArray(value.stack) || value.stack.length === 0) return null\n    return value\n  } catch {\n    return null\n  }\n}\n\n'''

          if 'function readStoredNavigationState()' not in text:
              marker = 'export default function App() {'
              if marker not in text:
                  raise SystemExit('App bootstrap marker not found; refusing to modify code')
              text = text.replace(marker, helper + marker, 1)

          marker = 'export default function App() {'
          bootstrap = "export default function App() {\n  const storedNavigation = readStoredNavigationState()"
          if 'const storedNavigation = readStoredNavigationState()' not in text:
              if marker not in text:
                  raise SystemExit('App export marker not found; refusing to modify code')
              text = text.replace(marker, bootstrap, 1)

          replacements = {
              "const [screenStack, setScreenStack] = useState<Screen[]>(['splash'])": "const [screenStack, setScreenStack] = useState<Screen[]>(() => storedNavigation?.stack || ['splash'])",
              "const [activeConversationId, setActiveConversationId] = useState<number | null>(null)": "const [activeConversationId, setActiveConversationId] = useState<number | null>(() => storedNavigation?.activeConversationId ?? null)",
              "const [activeDocumentId, setActiveDocumentId] = useState<number | null>(null)": "const [activeDocumentId, setActiveDocumentId] = useState<number | null>(() => storedNavigation?.activeDocumentId ?? null)",
              "const [activeGroupId, setActiveGroupId] = useState<number | null>(null)": "const [activeGroupId, setActiveGroupId] = useState<number | null>(() => storedNavigation?.activeGroupId ?? null)",
              "const [activeProfileUserId, setActiveProfileUserId] = useState<number | null>(null)": "const [activeProfileUserId, setActiveProfileUserId] = useState<number | null>(() => storedNavigation?.activeProfileUserId ?? null)",
              "const [activeOpportunityId, setActiveOpportunityId] = useState<number | null>(null)": "const [activeOpportunityId, setActiveOpportunityId] = useState<number | null>(() => storedNavigation?.activeOpportunityId ?? null)",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)

          required = [
              'storedNavigation?.stack || [\'splash\']',
              'storedNavigation?.activeConversationId',
              'storedNavigation?.activeDocumentId',
              'storedNavigation?.activeGroupId',
              'storedNavigation?.activeProfileUserId',
              'storedNavigation?.activeOpportunityId',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Navigation initializer replacement incomplete: ' + ', '.join(missing))

          if "sessionStorage.setItem('prepza-navigation-state'" not in text:
              marker2 = '  // Handles the round-trip back from /auth/google/callback'
              if marker2 not in text:
                  raise SystemExit('Navigation persistence insertion marker not found; refusing to modify code')
              persist = '''  useEffect(() => {\n    try {\n      sessionStorage.setItem('prepza-navigation-state', JSON.stringify({\n        stack: screenStack,\n        activeConversationId,\n        activeDocumentId,\n        activeGroupId,\n        activeProfileUserId,\n        activeOpportunityId,\n      }))\n    } catch { /* storage can be unavailable in private browsing */ }\n  }, [screenStack, activeConversationId, activeDocumentId, activeGroupId, activeProfileUserId, activeOpportunityId])\n\n'''
              text = text.replace(marker2, persist + marker2, 1)

          path.write_text(text)
          PY

      - name: TypeScript check
        run: |
          cd frontend
          corepack pnpm@10.34.3 install --frozen-lockfile
          corepack pnpm@10.34.3 exec tsc --noEmit

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx
          git rm .github/workflows/restore-navigation-persistence.yml
          git commit -m 'fix: preserve navigation across reloads'
          git push origin HEAD:main
