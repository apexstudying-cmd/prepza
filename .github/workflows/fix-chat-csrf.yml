name: Fix chat CSRF initialization

on:
  push:
    paths:
      - '.github/workflows/fix-chat-csrf.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ChatDetailScreen CSRF handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/App.tsx')
          text = path.read_text()

          anchor = """  useEffect(() => {\n    if (conversationId == null || !csrfToken) return\n    void api(`/chats/${conversationId}/read`, { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } }).catch(() => {})\n  }, [conversationId, csrfToken])\n"""
          helper = """  const getChatCsrfToken = async () => {\n    if (csrfToken) return csrfToken\n    const me = await api<{ id: number; csrf_token: string }>('/me')\n    if (!me.csrf_token) throw new Error('Could not establish a CSRF token for this session.')\n    setCsrfToken(me.csrf_token)\n    setMeId(me.id)\n    return me.csrf_token\n  }\n\n"""
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('CSRF insertion anchor not found; refusing to modify App.tsx')
              text = text.replace(anchor, anchor + "\n" + helper, 1)

          replacements = [
              (
                  """    try {\n      await api(`/chats/${conversationId}/messages`, { method: 'POST', headers: { 'X-CSRF-Token': csrfToken }, body: JSON.stringify({ body: JSON.stringify(envelope), kind: 'text' }) })\n""",
                  """    try {\n      const token = await getChatCsrfToken()\n      await api(`/chats/${conversationId}/messages`, { method: 'POST', headers: { 'X-CSRF-Token': token }, body: JSON.stringify({ body: JSON.stringify(envelope), kind: 'text' }) })\n"""
              ),
              (
                  """    try {\n      await api(`/chats/${conversationId}/messages`, { method: 'POST', headers: { 'X-CSRF-Token': csrfToken }, body: JSON.stringify({ body: JSON.stringify(envelope), kind: 'reaction' }) })\n""",
                  """    try {\n      const token = await getChatCsrfToken()\n      await api(`/chats/${conversationId}/messages`, { method: 'POST', headers: { 'X-CSRF-Token': token }, body: JSON.stringify({ body: JSON.stringify(envelope), kind: 'reaction' }) })\n"""
              ),
              (
                  """    try {\n      const init = await api<{ attachment_id: number; upload_url: string }>(`/chats/${conversationId}/attachments`, { method: 'POST', headers: { 'X-CSRF-Token': csrfToken }, body: JSON.stringify({ original_filename: file.name, file_size_bytes: file.size }) })\n""",
                  """    try {\n      const token = await getChatCsrfToken()\n      const init = await api<{ attachment_id: number; upload_url: string }>(`/chats/${conversationId}/attachments`, { method: 'POST', headers: { 'X-CSRF-Token': token }, body: JSON.stringify({ original_filename: file.name, file_size_bytes: file.size }) })\n"""
              ),
              (
                  """      await api(`/chats/${conversationId}/attachments/${init.attachment_id}/uploaded`, { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } })\n      await api(`/chats/${conversationId}/messages`, { method: 'POST', headers: { 'X-CSRF-Token': csrfToken }, body: JSON.stringify({ attachment_id: init.attachment_id, kind: 'text' }) })\n""",
                  """      await api(`/chats/${conversationId}/attachments/${init.attachment_id}/uploaded`, { method: 'POST', headers: { 'X-CSRF-Token': token } })\n      await api(`/chats/${conversationId}/messages`, { method: 'POST', headers: { 'X-CSRF-Token': token }, body: JSON.stringify({ attachment_id: init.attachment_id, kind: 'text' }) })\n"""
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected chat write block not found; refusing partial modification')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: TypeScript check
        run: |
          cd frontend
          corepack pnpm@10.34.3 exec tsc --noEmit

      - name: Frontend build
        run: |
          cd frontend
          corepack pnpm@10.34.3 run build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx .github/workflows/fix-chat-csrf.yml
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'fix: initialize chat CSRF token before sends'
          git rm .github/workflows/fix-chat-csrf.yml
          git commit -m 'chore: remove temporary chat CSRF repair workflow'
          git push origin main
