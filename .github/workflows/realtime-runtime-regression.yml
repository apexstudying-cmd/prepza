name: Realtime Runtime Regression

'on':
  push:
    branches:
      - feat/realtime-study-chat
  pull_request:
    paths:
      - 'realtime_server.py'
      - 'scripts/test_realtime_runtime.py'
      - 'requirements.txt'
      - '.github/workflows/realtime-runtime-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime-runtime:
    name: Socket.IO runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SQLALCHEMY_DATABASE_URI: sqlite:///:memory:
      SECRET_KEY: realtime-test-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run realtime runtime regression tests
        run: python -m pytest scripts/test_realtime_runtime.py -q
