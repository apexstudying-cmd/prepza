name: Realtime Runtime Regression

'on':
  push:
    branches:
      - main
      - feat/realtime-study-chat
  pull_request:
    paths:
      - 'realtime_server.py'
      - 'chat_interactions.py'
      - 'scripts/test_realtime_runtime.py'
      - 'scripts/test_calling_runtime.py'
      - 'scripts/test_chat_interactions.py'
      - 'requirements.txt'
      - '.github/workflows/realtime-runtime-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime-runtime:
    name: Socket.IO runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      SECRET_KEY: realtime-test-secret
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact commit under test
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run realtime, call, and chat interaction regressions
        run: python -m pytest scripts/test_realtime_runtime.py scripts/test_calling_runtime.py scripts/test_chat_interactions.py -q
