name: Release Browser and Cross-System Regression

on:
  push:
    branches: [main]
    paths:
      - 'scripts/test_browser_mobile_responsive.py'
      - 'scripts/test_browser_study_hub_offline_content.py'
      - 'scripts/test_browser_b2b_metering.py'
      - 'discovery_billing.py'
      - 'b2b_campaign_metering.py'
      - 'b2b_campaign_payments.py'
      - 'student_subscription_billing.py'
      - 'auth_otp.py'
      - 'object_storage.py'
      - 'ai_service.py'
      - 'kokoro_worker/**'
      - 'tests/test_b2b_billing_regression.py'
      - 'tests/test_local_qa_real_world.py'
      - 'shop_marketplace.py'
      - 'tests/test_shop_marketplace.py'
      - 'tests/test_shop_browse_cache_contract.py'
      - 'tests/test_shop_image_cache_contract.py'
      - 'tests/test_provider_boundary_mocks.py'
      - '.github/workflows/b2b-contract-validation.yml'
      - 'chat_event_queue.py'
      - 'chat_event_worker.py'
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'tools/**'
      - 'app.py'
      - 'document_pipeline.py'
      - 'study_retrieval.py'
      - 'study_retrieval_service.py'
      - 'study_retrieval_routes.py'
      - 'request_observability.py'
      - 'migrations/*.sql'
      - 'tests/test_study_retrieval*.py'
      - 'tests/test_request_observability.py'
      - 'tests/test_document_pipeline_runtime.py'
      - 'alembic/**'
      - 'schema/local_baseline.sql'
      - 'Dockerfile'
      - 'docker-compose.vps.yml'
      - 'requirements.txt'
      - 'requirements-test.txt'
      - '.github/workflows/mobile-responsive-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-responsive:
    name: Responsive, offline and cross-system release gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert exact commit under test
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Create isolated CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=prepza
          POSTGRES_PASSWORD=prepza-ci-password
          POSTGRES_DB=prepza
          SECRET_KEY=prepza-ci-only-secret
          FLASK_TESTING=1
          PREPZA_TIMEZONE=Africa/Nairobi
          EOF

      - name: Build the production app image
        run: docker compose -f docker-compose.vps.yml build app

      - name: Start disposable PostgreSQL and Redis
        run: docker compose -f docker-compose.vps.yml up -d postgres redis

      - name: Apply Alembic migrations to disposable database
        run: docker compose -f docker-compose.vps.yml run --rm app python -m alembic upgrade head

      - name: Apply additive page-text and observability SQL migrations to disposable PostgreSQL
        run: |
          docker compose -f docker-compose.vps.yml run --rm app python - <<'PY'
          from pathlib import Path
          from app import app, db

          migration_paths = [
              Path("migrations/20261029_document_page_text.sql"),
              Path("migrations/20261029_request_observability.sql"),
          ]
          with app.app_context():
              connection = db.engine.raw_connection()
              try:
                  cursor = connection.cursor()
                  for path in migration_paths:
                      cursor.execute(path.read_text(encoding="utf-8"))
                      print(f"Applied disposable CI migration: {path.name}")
                  cursor.execute("SELECT to_regclass('public.document_page_text'), to_regclass('public.request_observability_event')")
                  page_table, event_table = cursor.fetchone()
                  if not page_table or not event_table:
                      raise RuntimeError("Expected retrieval/observability tables are missing")
                  connection.commit()
              except Exception:
                  connection.rollback()
                  raise
              finally:
                  connection.close()
          PY

      - name: Start app
        run: |
          docker compose -f docker-compose.vps.yml up -d app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/ >/dev/null; then
              echo "Prepza app is responding."
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.vps.yml logs --tail=200 app
          exit 1

      - name: Set up Python 3.13 for browser test dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Seed academic catalog for isolated student fixtures
        run: |
          docker compose -f docker-compose.vps.yml run --rm -T app python - <<'PY'
          from app import app, db, University, Program

          with app.app_context():
              university = (
                  University.query.filter_by(is_active=True)
                  .order_by(University.id.asc()).first()
              )
              if university is None:
                  university = University(
                      name="Prepza CI University",
                      short_code="CI-RELEASE",
                      country="Kenya",
                      is_active=True,
                  )
                  db.session.add(university)
                  db.session.flush()

              program = (
                  Program.query.filter_by(
                      university_id=university.id, is_active=True
                  ).order_by(Program.id.asc()).first()
              )
              if program is None:
                  db.session.add(Program(
                      university_id=university.id,
                      name="CI Test Program",
                      degree_level="undergraduate",
                      discipline_category="general",
                      is_active=True,
                  ))
              db.session.commit()
              print(f"Academic catalog ready for browser fixtures: university_id={university.id}")
          PY

      - name: Run mobile and tablet responsive browser checks
        run: python scripts/test_browser_mobile_responsive.py

      - name: Run B2B browser-to-ledger metering regression
        run: python scripts/test_browser_b2b_metering.py

      - name: Run full disposable PostgreSQL QA suite
        run: |
          # Use an ephemeral test container with the checked-out source mounted.
          # The production app image intentionally excludes QA files and pytest.
          docker compose -f docker-compose.vps.yml run --rm --no-deps \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e DATABASE_URL="postgresql+psycopg2://prepza:prepza-ci-password@postgres:5432/prepza" \
            -e SECRET_KEY="prepza-ci-only-secret" \
            app sh -lc 'python -m pip install "pytest>=8,<9" && python tools/run_local_qa.py'

      - name: Run online/offline and generated-artifact browser journeys
        shell: bash
        run: |
          set +e
          python scripts/test_browser_study_hub_offline.py -q
          offline_status=$?
          python scripts/test_browser_study_hub_offline_content.py -q
          artifact_status=$?
          set -e
          if [ "$offline_status" -ne 0 ] || [ "$artifact_status" -ne 0 ]; then
            echo "Browser journey failures: offline_lifecycle=$offline_status artifact_replay=$artifact_status"
            exit 1
          fi

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepza-mobile-responsive-screenshots
          path: artifacts/mobile-responsive/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect app logs on failure
        if: failure()
        run: docker compose -f docker-compose.vps.yml logs --tail=300 app postgres redis

      - name: Stop disposable services
        if: always()
        run: docker compose -f docker-compose.vps.yml down -v
