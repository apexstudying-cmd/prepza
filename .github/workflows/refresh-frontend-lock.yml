name: Refresh Frontend Lockfile

on:
  push:
    branches: [main]
    paths:
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/refresh-frontend-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore: refresh frontend lockfile'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: npm install --global corepack@latest && corepack enable && corepack prepare pnpm@10.34.3 --activate

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Commit refreshed lockfile
        working-directory: .
        run: |
          if git diff --quiet -- frontend/pnpm-lock.yaml; then
            echo 'Lockfile already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/pnpm-lock.yaml
          git commit -m 'chore: refresh frontend lockfile'
          git push origin main
