name: Backend Shared Extension Contract

on:
  pull_request:
    paths:
      - 'app.py'
      - 'db_runtime.py'
      - 'extensions.py'
      - 'academic_models.py'
      - 'tests/test_academic_models_contract.py'
      - 'tests/test_backend_extensions_contract.py'
      - '.github/workflows/backend-extension-contract.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'db_runtime.py'
      - 'extensions.py'
      - 'tests/test_backend_extensions_contract.py'
      - '.github/workflows/backend-extension-contract.yml'

permissions:
  contents: read

jobs:
  extension-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install focused backend test dependencies
        run: python -m pip install pytest Flask==3.1.3 Flask-SQLAlchemy==3.1.1 SQLAlchemy==2.0.51 psycopg2-binary==2.9.12
      - name: Compile shared extension modules and Flask entry point
        run: python -m py_compile app.py db_runtime.py extensions.py
      - name: Run shared extension contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_backend_extensions_contract.py tests/test_academic_models_contract.py
