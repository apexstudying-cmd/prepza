      - 'extensions.py'
      - 'db_runtime.py'
      - 'academic_models.py'
      - 'learning_models.py'
      - 'study_models.py'
      - 'document_models.py'
      - 'library_models.py'
      - 'user_models.py'
      - 'core_models.py'
      - 'chat_models.py'
      - 'social_models.py'
      - 'opportunity_models.py'
      - 'security_models.py'
      - 'observability_models.py'
      - 'tests/test_backend_extensions_contract.py'
      - 'tests/test_app_factory_contract.py'
      - 'tests/test_backend_route_registry_contract.py'
      - 'tests/test_gamification_routes_module_contract.py'
      - 'tests/test_notification_preferences_routes_module_contract.py'
      - 'tests/test_social_follow_routes_module_contract.py'
      - 'tests/test_group_routes_module_contract.py'
      - 'tests/test_library_routes_module_contract.py'
      - 'tests/test_library_models_extraction_contract.py'
      - 'tests/test_apply_studyhub_library_rules.py'
      - 'tests/test_backend_model_boundaries.py'
      - 'tests/test_chat_models_extraction_contract.py'
      - 'tests/test_social_models_extraction_contract.py'
      - 'tests/test_opportunity_models_extraction_contract.py'
      - 'tests/test_user_model_extraction_contract.py'
      - 'tests/test_core_models_extraction_contract.py'
      - 'tests/test_auth_guards_contract.py'
      - 'tests/test_academic_models_contract.py'
      - 'tests/test_learning_models_extraction_contract.py'
      - 'tests/test_study_models_extraction_contract.py'
      - 'tests/test_document_models_extraction_contract.py'
      - '.github/workflows/backend-extension-contract.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'app_factory.py'
      - 'route_registry.py'
      - 'library_routes.py'
      - 'tools/apply_library_academic_context.py'
      - 'tools/apply_library_exact_academic_eligibility.py'
      - 'tools/apply_studyhub_library_rules.py'
      - 'tools/audit_unit_references.py'
      - 'group_routes.py'
      - 'social_follow_routes.py'
      - 'notification_routes.py'
      - 'gamification_routes.py'
      - 'auth_guards.py'
      - 'extensions.py'
      - 'db_runtime.py'
      - 'academic_models.py'
      - 'learning_models.py'
      - 'study_models.py'
      - 'document_models.py'
      - 'library_models.py'
      - 'user_models.py'
      - 'core_models.py'
      - 'chat_models.py'
      - 'social_models.py'
      - 'opportunity_models.py'
      - 'security_models.py'
      - 'observability_models.py'
      - 'tests/test_backend_extensions_contract.py'
      - 'tests/test_app_factory_contract.py'
      - 'tests/test_backend_route_registry_contract.py'
      - 'tests/test_gamification_routes_module_contract.py'
      - 'tests/test_notification_preferences_routes_module_contract.py'
      - 'tests/test_social_follow_routes_module_contract.py'
      - 'tests/test_group_routes_module_contract.py'
      - 'tests/test_library_routes_module_contract.py'
      - 'tests/test_library_models_extraction_contract.py'
      - 'tests/test_apply_studyhub_library_rules.py'
      - 'tests/test_backend_model_boundaries.py'
      - 'tests/test_chat_models_extraction_contract.py'
      - 'tests/test_social_models_extraction_contract.py'
      - 'tests/test_opportunity_models_extraction_contract.py'
      - 'tests/test_user_model_extraction_contract.py'
      - 'tests/test_core_models_extraction_contract.py'
      - 'tests/test_auth_guards_contract.py'
      - 'tests/test_academic_models_contract.py'
      - 'tests/test_learning_models_extraction_contract.py'
      - 'tests/test_study_models_extraction_contract.py'
      - 'tests/test_document_models_extraction_contract.py'
      - 'tests/test_library_models_extraction_contract.py'
      - '.github/workflows/backend-extension-contract.yml'

permissions:
  contents: read

jobs:
  extension-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install focused backend test dependencies
        run: python -m pip install pytest Flask==3.1.3 Flask-Limiter==4.1.1 Flask-SQLAlchemy==3.1.1 SQLAlchemy==2.0.51 psycopg2-binary==2.9.12
      - name: Compile shared extension modules and Flask entry point
        run: python -m py_compile app.py app_factory.py route_registry.py gamification_routes.py notification_routes.py social_follow_routes.py group_routes.py library_routes.py auth_guards.py extensions.py db_runtime.py academic_models.py learning_models.py study_models.py document_models.py library_models.py user_models.py core_models.py chat_models.py social_models.py opportunity_models.py security_models.py observability_models.py
      - name: Run backend boundary and compatibility tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_backend_extensions_contract.py tests/test_app_factory_contract.py tests/test_backend_route_registry_contract.py tests/test_gamification_routes_module_contract.py tests/test_notification_preferences_routes_module_contract.py tests/test_social_follow_routes_module_contract.py tests/test_group_routes_module_contract.py tests/test_library_routes_module_contract.py tests/test_library_models_extraction_contract.py tests/test_apply_studyhub_library_rules.py tests/test_backend_model_boundaries.py tests/test_chat_models_extraction_contract.py tests/test_social_models_extraction_contract.py tests/test_opportunity_models_extraction_contract.py tests/test_user_model_extraction_contract.py tests/test_core_models_extraction_contract.py tests/test_auth_guards_contract.py tests/test_academic_models_contract.py tests/test_learning_models_extraction_contract.py tests/test_study_models_extraction_contract.py tests/test_document_models_extraction_contract.py
