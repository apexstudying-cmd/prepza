name: Admin Route Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  admin-route-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify admin frontend/backend route contract
        run: python tools/audit_admin_route_contract.py
