name: staging-load-test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployable staging base URL"
        required: true
        type: string
      http_vus:
        description: "HTTP virtual users"
        required: false
        default: "25"
        type: string
      ws_vus:
        description: "Realtime virtual users"
        required: false
        default: "25"
        type: string
      duration:
        description: "HTTP/WS test duration"
        required: false
        default: "30s"
        type: string

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ inputs.base_url }}
      HTTP_VUS: ${{ inputs.http_vus }}
      WS_VUS: ${{ inputs.ws_vus }}
      HTTP_DURATION: ${{ inputs.duration }}
      WS_DURATION: ${{ inputs.duration }}
      AUTH_COOKIE: ${{ secrets.STAGING_AUTH_COOKIE }}
      CONVERSATION_ID: ${{ secrets.STAGING_CONVERSATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate load-test script with k6
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work grafana/k6:latest inspect load_tests/prepza_staging.js
      - name: Run staging load test
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e BASE_URL \
            -e HTTP_VUS \
            -e WS_VUS \
            -e HTTP_DURATION \
            -e WS_DURATION \
            -e AUTH_COOKIE \
            -e CONVERSATION_ID \
            grafana/k6:latest run load_tests/prepza_staging.js
