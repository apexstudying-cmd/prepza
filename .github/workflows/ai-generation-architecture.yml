name: AI generation architecture

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - audit/ai-generation-architecture
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/ai-generation-architecture
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Apply deterministic source patch
        run: python scripts/apply_ai_generation_architecture.py

      - name: Compile changed Python files
        run: python -m py_compile app.py ai_service.py ai_reusable_generation.py ai_generation_store.py ai_artifact_fingerprint.py

      - name: Run focused AI architecture tests
        env:
          PYTHONPATH: .
        run: |
          set +e
          pytest -q tests/test_ai_artifact_fingerprint.py tests/test_ai_generation_store.py tests/test_ai_reusable_generation.py 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-generation-test-diagnostics
          path: pytest-output.txt
          if-no-files-found: warn

      - name: Commit patched application files
        if: success()
        run: |
          if git diff --quiet -- app.py ai_service.py; then
            echo 'No application patch was produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py ai_service.py
          git commit -m 'Wire reusable AI generation into document materials'
          git push origin audit/ai-generation-architecture
