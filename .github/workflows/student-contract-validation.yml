name: Student contract validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest sqlalchemy Flask
      - name: Compile student billing modules
        run: |
          python -m py_compile student_orders.py student_subscription_billing.py ai_economics.py usage_billing.py ai_reusable_generation.py
      - name: Run student order and subscription contract tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_student_orders.py tests/test_student_subscription_billing.py tests/test_ai_economics.py
