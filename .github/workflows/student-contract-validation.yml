name: Student contract validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The shared pytest conftest imports the full Flask app, so give it the same disposable SQLite URL used by focused CI runtime tests.
  student-contract:
    env:
      DATABASE_URL: 'sqlite:////tmp/prepza_ci_qa'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile student billing modules
        run: |
          python -m py_compile app.py student_orders.py student_subscription_billing.py ai_economics.py usage_billing.py ai_reusable_generation.py
      - name: Run student order and subscription contract tests
        env:
          PYTHONPATH: .
        run: pytest --confcutdir=scripts -q tests/test_student_orders.py tests/test_student_subscription_billing.py tests/test_ai_economics.py scripts/test_chat_ui_contract.py
