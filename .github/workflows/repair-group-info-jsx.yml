name: Repair group info JSX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair group info JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/crypto/WhatsAppChatExperience.tsx')
          text = p.read_text(encoding='utf-8')
          old = "color:'#a33a35;fontSize:10;fontWeight:800,cursor:'pointer',padding:'7px'"
          new = "color:'#a33a35',fontSize:10,fontWeight:800,cursor:'pointer',padding:'7px'"
          if old not in text:
              raise SystemExit(f'anchor not found; malformed fragments={text.count("color:\'#a33a35;fontSize") }')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/crypto/WhatsAppChatExperience.tsx
          git commit -m 'fix(chat): repair group info action styling'
          git push
