name: Apply chat group management UX patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply group management UX patch
        run: python tools/apply_chat_group_management_ux.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/crypto/WhatsAppChatExperience.tsx
          git diff --cached --quiet || git commit -m 'feat(chat): add group info and membership controls'
          git push
