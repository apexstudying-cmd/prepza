name: Repair group member style fragment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair style fragment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/crypto/WhatsAppChatExperience.tsx')
          text = p.read_text(encoding='utf-8')
          old = "color:'#a33a35;fontSize:10;fontWeight:800,cursor:"
          new = "color:'#a33a35',fontSize:10,fontWeight:800,cursor:"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one malformed style fragment, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/crypto/WhatsAppChatExperience.tsx
          git commit -m 'fix(chat): repair malformed group member style'
          git push
