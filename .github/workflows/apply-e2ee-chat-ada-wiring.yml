name: apply-e2ee-chat-ada-wiring

on:
  push:
    branches:
      - feat/realtime-study-chat
    paths:
      - 'wire_e2ee_chat_ada_patch.py'
      - '.github/workflows/apply-e2ee-chat-ada-wiring.yml'
      - 'app.py'
      - 'e2ee_chat_routes.py'
      - 'e2ee_ada_routes.py'
      - 'e2ee_chat_models.py'
      - 'scripts/test_realtime_runtime.py'
      - 'scripts/validate_realtime_security.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded wiring patch
        run: python3 wire_e2ee_chat_ada_patch.py
      - name: Compile patched backend
        run: python3 -m py_compile app.py e2ee_chat_routes.py e2ee_ada_routes.py e2ee_chat_models.py realtime_server.py
      - name: Validate security invariants
        run: |
          python3 scripts/validate_e2ee_security.py
          python3 scripts/validate_e2ee_lifecycle.py
          python3 scripts/validate_realtime_security.py
      - name: Run realtime regression tests
        run: |
          python3 -m pip install -r requirements.txt pytest
          python3 -m pytest scripts/test_realtime_runtime.py -q
      - name: Verify route wiring
        run: |
          test "$(grep -c 'from e2ee_chat_models import create_e2ee_models' app.py)" -eq 1
          test "$(grep -c 'ConversationKeyEnvelope = create_e2ee_models(db)' app.py)" -eq 1
          test "$(grep -c 'register_e2ee_chat_routes(' app.py)" -eq 1
          test "$(grep -c 'register_e2ee_ada_route(' app.py)" -eq 1
          ! grep -q '@app.post("/keys/register")' e2ee_chat_routes.py
          ! grep -q '@app.get("/keys/<int:user_id>")' e2ee_chat_routes.py
      - name: Commit verified wiring and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py e2ee_chat_routes.py
          git rm .github/workflows/apply-e2ee-chat-ada-wiring.yml
          git commit -m 'fix: wire e2ee chat and scoped ada routes'
          git push origin HEAD:feat/realtime-study-chat
