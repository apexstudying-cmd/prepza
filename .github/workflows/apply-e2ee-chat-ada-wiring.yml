name: Legacy E2EE Wiring Workflow (Disabled)

# This workflow intentionally has no automatic trigger and no write permission.
# E2EE/Chat/Ada verification belongs in e2ee-chat-validation.yml.
# Code changes must be made in a normal commit and then verified by CI.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled workflow
        run: |
          echo 'This legacy workflow is disabled.'
          echo 'Use E2EE Chat Validation for read-only exact-commit verification.'
          exit 1
