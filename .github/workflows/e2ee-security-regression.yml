name: E2EE Security Regression

on:
  push:
    branches:
      - main
      - feat/e2ee-study-chats
      - feat/e2ee-study-chat-completion
      - feat/realtime-study-chat
  pull_request:
    paths:
      - 'app.py'
      - 'e2ee_chat_models.py'
      - 'e2ee_chat_routes.py'
      - 'e2ee_ada_routes.py'
      - 'prepza_control.py'
      - 'realtime_server.py'
      - 'frontend/src/crypto/**'
      - 'frontend/src/App.tsx'
      - 'frontend/src/main.tsx'
      - 'migrations/*e2ee*'
      - 'scripts/validate_e2ee_security.py'
      - 'scripts/validate_e2ee_lifecycle.py'
      - 'scripts/validate_realtime_security.py'
      - 'scripts/test_realtime_runtime.py'
      - '.github/workflows/e2ee-security-regression.yml'

permissions:
  contents: read

env:
  DATABASE_URL: sqlite:///:memory:
  SECRET_KEY: realtime-test-secret

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate E2EE security invariants
        run: python scripts/validate_e2ee_security.py
      - name: Validate E2EE lifecycle invariants
        run: python scripts/validate_e2ee_lifecycle.py
      - name: Validate realtime security invariants
        run: python scripts/validate_realtime_security.py
      - name: Compile E2EE and realtime backend modules
        run: python -m py_compile app.py e2ee_chat_models.py e2ee_chat_routes.py e2ee_ada_routes.py prepza_control.py realtime_server.py
      - name: Install realtime regression test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run realtime runtime regression tests
        run: python -m pytest scripts/test_realtime_runtime.py -q

# Chunk 1 CI synchronization marker: runtime regression must use isolated SQLite.
