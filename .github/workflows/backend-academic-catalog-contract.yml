name: Backend Public and Academic Route Contracts

on:
  pull_request:
    paths:
      - 'app.py'
      - 'academic_catalog_routes.py'
      - 'public_shell_routes.py'
      - 'tests/test_academic_catalog_routes_contract.py'
      - 'tests/test_public_shell_routes_contract.py'
      - '.github/workflows/backend-academic-catalog-contract.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'academic_catalog_routes.py'
      - 'tests/test_academic_catalog_routes_contract.py'
      - '.github/workflows/backend-academic-catalog-contract.yml'

permissions:
  contents: read

jobs:
  academic-catalog-route-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused route test dependency
        run: python -m pip install pytest Flask==3.1.3
      - name: Compile the Flask entry point and route modules
        run: python -m py_compile app.py academic_catalog_routes.py
      - name: Run public shell and academic catalog route contracts
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_academic_catalog_routes_contract.py tests/test_public_shell_routes_contract.py
