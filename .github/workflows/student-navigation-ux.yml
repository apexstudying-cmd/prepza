name: Student navigation UX

on:
  push:
    branches: [ux/student-navigation-study-flow]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply navigation UX patch
        run: |
          python3 scripts/apply_student_navigation_ux_v4.py
          python3 scripts/apply_student_navigation_ux_v5.py
          python3 scripts/apply_navigation_screen_cleanup.py
          python3 scripts/apply_document_study_progress.py
          python3 scripts/apply_document_reader.py
          python3 scripts/apply_student_study_access.py
          python3 scripts/apply_published_material_entry.py
          python3 scripts/apply_document_reader_v2.py
          python3 scripts/apply_published_material_replay.py
          python3 scripts/apply_study_flow_cleanup.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify patches are deterministic
        run: |
          cp frontend/src/App.tsx /tmp/App.after
          python3 scripts/apply_student_navigation_ux_v4.py
          python3 scripts/apply_student_navigation_ux_v5.py
          python3 scripts/apply_navigation_screen_cleanup.py
          python3 scripts/apply_document_study_progress.py
          python3 scripts/apply_document_reader.py
          python3 scripts/apply_student_study_access.py
          python3 scripts/apply_published_material_entry.py
          python3 scripts/apply_document_reader_v2.py
          python3 scripts/apply_published_material_replay.py
          python3 scripts/apply_study_flow_cleanup.py
          cmp frontend/src/App.tsx /tmp/App.after

      - name: Verify study-flow security and navigation anchors
        run: |
          grep -F 'if not _can_study_document(user_id, document):' app.py
          grep -F 'document.user_id == user_id:' app.py
          grep -F 'if document.user_id != user_id:' app.py
          grep -F 'return jsonify({"error": "Podcast audio is not ready yet"}), 409' app.py
          grep -F 'view_url = get_signed_url(content.storage_path, bucket="documents")' app.py
          grep -F 'def _published_ready_material_for_viewer(' app.py
          grep -F 'scope="shared"' app.py
          grep -F 'owner_user_id=None' app.py
          grep -F 'Published summary has not been generated yet' app.py
          grep -F 'Published quiz has not been generated yet' app.py
          grep -F 'Published flashcards has not been generated yet' app.py
          grep -F 'Published mindmap has not been generated yet' app.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text()
          shared = '''    if document.user_id != user_id:\n        material = GeneratedMaterial.query.filter_by(\n            document_content_id=document.document_content_id,\n            material_type="podcast",\n            status="ready",\n            scope="shared",\n            owner_user_id=None,\n        ).first()'''
          assert s.count(shared) == 1, f'expected one published podcast script lookup, found {s.count(shared)}'
          guard = '''    if document.user_id != user_id:\n        return jsonify({"error": "Podcast audio is not ready yet"}), 409\n\n'''
          assert s.count(guard) == 1, f'expected one podcast synthesis guard, found {s.count(guard)}'
          assert s.count('Podcast has not been published yet') == 1, 'expected one published podcast error'
          assert 'scope="shared"' in s, 'expected shared-scope protection for published artifacts'
          PY
          grep -F 'const [readingPage, setReadingPage] = useState(0)' frontend/src/App.tsx
          grep -F '/documents/${activeDocumentId}/reading' frontend/src/App.tsx
          grep -F "setScreen('podcast-library')" frontend/src/App.tsx
          grep -F "p.status === 'approved' && p.document_id" frontend/src/App.tsx
          grep -F "'document-reader'" frontend/src/App.tsx

      - name: Verify reading progress migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('migrations/add_document_reading_progress.sql').read_text()
          required = [
              'CREATE TABLE IF NOT EXISTS document_reading_progress',
              'REFERENCES "user"(id)',
              'REFERENCES document(id)',
              'CONSTRAINT uq_document_reading_progress_user_document UNIQUE (user_id, document_id)',
              'CONSTRAINT ck_document_reading_progress_page_nonnegative CHECK (page_num >= 0)',
              'CREATE INDEX IF NOT EXISTS ix_document_reading_progress_user_id',
              'CREATE INDEX IF NOT EXISTS ix_document_reading_progress_document_id',
          ]
          for anchor in required:
              assert anchor in s, f'missing migration anchor: {anchor}'
          assert 'DROP TABLE' not in s.upper(), 'reading progress migration must not drop data'
          assert s.count('CREATE TABLE IF NOT EXISTS document_reading_progress') == 1
          assert s.count('CREATE INDEX IF NOT EXISTS') == 2
          print('reading progress migration structure verified')
          PY

      - name: Compile backend
        run: python3 -m py_compile app.py document_pipeline.py scripts/apply_navigation_screen_cleanup.py scripts/apply_document_study_progress.py scripts/apply_document_reader.py scripts/apply_document_reader_v2.py scripts/apply_student_study_access.py scripts/apply_published_material_entry.py scripts/apply_published_material_replay.py scripts/apply_study_flow_cleanup.py

      - name: Commit generated frontend and backend change
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx app.py migrations/add_document_reading_progress.sql scripts/apply_student_navigation_ux_v4.py scripts/apply_student_navigation_ux_v5.py scripts/apply_navigation_screen_cleanup.py scripts/apply_document_study_progress.py scripts/apply_document_reader.py scripts/apply_student_study_access.py scripts/apply_published_material_entry.py scripts/apply_document_reader_v2.py scripts/apply_published_material_replay.py scripts/apply_study_flow_cleanup.py .github/workflows/student-navigation-ux.yml
          git commit -m 'feat: complete student study navigation'
          git push origin HEAD:ux/student-navigation-study-flow