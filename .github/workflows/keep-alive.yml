name: Keep Prepza Awake

on:
  schedule:
    # Runs every 10 minutes, all day, every day.
    # GitHub's actual trigger timing can drift a few minutes under load -
    # that's fine here, we just need "roughly every 10 min", not precision.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health endpoint
        run: |
          curl -sf https://prepza-sf60.onrender.com/health || echo "Ping failed - Render or Supabase may be down"
