name: E2EE Chat Validation

on:
  push:
    branches:
      - main
      - feat/e2ee-study-chats
    paths:
      - 'app.py'
      - 'e2ee_chat_*.py'
      - 'e2ee_ada_routes.py'
      - 'prepza_control.py'
      - 'migrations/add_group_chat_e2ee.sql'
      - 'migrations/add_message_e2ee_key_epoch.sql'
      - 'migrations/default_new_direct_e2ee.sql'
      - 'migrations/remove_duplicate_group_e2ee_trigger.sql'
      - 'frontend/src/crypto/**'
      - 'frontend/src/main.tsx'
      - 'frontend/src/App.tsx'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/e2ee-chat-validation.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'e2ee_chat_*.py'
      - 'e2ee_ada_routes.py'
      - 'prepza_control.py'
      - 'migrations/add_group_chat_e2ee.sql'
      - 'migrations/add_message_e2ee_key_epoch.sql'
      - 'migrations/default_new_direct_e2ee.sql'
      - 'migrations/remove_duplicate_group_e2ee_trigger.sql'
      - 'frontend/src/crypto/**'
      - 'frontend/src/main.tsx'
      - 'frontend/src/App.tsx'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/e2ee-chat-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile E2EE backend modules and app
        run: |
          python -m py_compile app.py e2ee_chat_models.py e2ee_chat_routes.py e2ee_ada_routes.py prepza_control.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
