name: E2EE Chat Validation

on:
  push:
    branches: [feat/e2ee-study-chats]
    paths:
      - 'app.py'
      - 'e2ee_chat_*.py'
      - 'prepza_control.py'
      - 'scripts/apply_group_chat_e2ee_backend.py'
      - 'migrations/add_group_chat_e2ee.sql'
      - 'migrations/add_message_e2ee_key_epoch.sql'
      - 'frontend/src/crypto/**'
      - 'frontend/src/main.tsx'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/e2ee-chat-validation.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'e2ee_chat_*.py'
      - 'prepza_control.py'
      - 'scripts/apply_group_chat_e2ee_backend.py'
      - 'migrations/add_group_chat_e2ee.sql'
      - 'migrations/add_message_e2ee_key_epoch.sql'
      - 'frontend/src/crypto/**'
      - 'frontend/src/main.tsx'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/e2ee-chat-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and simulate app.py E2EE patch
        run: |
          python -m py_compile e2ee_chat_models.py e2ee_chat_routes.py prepza_control.py scripts/apply_group_chat_e2ee_backend.py
          python scripts/apply_group_chat_e2ee_backend.py
          python -m py_compile app.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
