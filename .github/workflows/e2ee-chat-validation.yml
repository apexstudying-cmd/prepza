name: E2EE Chat Validation

on:
  push:
    branches:
      - main
      - feat/e2ee-study-chats
      - feat/realtime-study-chat
    paths:
      - 'app.py'
      - 'e2ee_chat_*.py'
      - 'e2ee_ada_routes.py'
      - 'prepza_control.py'
      - 'realtime_server.py'
      - 'chat_interactions.py'
      - 'migrations/**e2ee*.sql'
      - 'migrations/*group*chat*.sql'
      - 'migrations/*message*key*epoch*.sql'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/e2ee-chat-validation.yml'
      - '.github/workflows/realtime-runtime-regression.yml'
      - 'requirements.txt'
      - 'scripts/test_realtime_runtime.py'
      - 'scripts/test_chat_interactions.py'
      - 'scripts/validate_e2ee_security.py'
      - 'scripts/validate_e2ee_lifecycle.py'
      - 'scripts/validate_realtime_security.py'
      - 'scripts/validate_shared_study_context.py'
  pull_request:
    paths:
      - 'app.py'
      - 'e2ee_chat_*.py'
      - 'e2ee_ada_routes.py'
      - 'prepza_control.py'
      - 'realtime_server.py'
      - 'chat_interactions.py'
      - 'migrations/**e2ee*.sql'
      - 'migrations/*group*chat*.sql'
      - 'migrations/*message*key*epoch*.sql'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/e2ee-chat-validation.yml'
      - '.github/workflows/realtime-runtime-regression.yml'
      - 'requirements.txt'
      - 'scripts/test_realtime_runtime.py'
      - 'scripts/test_chat_interactions.py'
      - 'scripts/validate_e2ee_security.py'
      - 'scripts/validate_e2ee_lifecycle.py'
      - 'scripts/validate_realtime_security.py'
      - 'scripts/validate_shared_study_context.py'

permissions:
  contents: read

# Verification contract:
# - CI is read-only.
# - CI never patches or pushes the branch under test.
# - actions/checkout tests the exact event commit, not a moving branch ref.
# - A failed check requires a new code commit and a fresh run.
env:
  DATABASE_URL: 'sqlite:///:memory:'
  SECRET_KEY: realtime-test-secret

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Assert checked-out commit is the event SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Compile E2EE backend modules and app
        run: |
          python -m py_compile app.py e2ee_chat_models.py e2ee_chat_routes.py e2ee_ada_routes.py prepza_control.py realtime_server.py

      - name: Validate E2EE and realtime security invariants
        run: |
          python scripts/validate_e2ee_security.py
          python scripts/validate_e2ee_lifecycle.py
          python scripts/validate_realtime_security.py
          python scripts/validate_shared_study_context.py

      - name: Install backend regression dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run realtime and chat regressions
        run: python -m pytest scripts/test_realtime_runtime.py scripts/test_chat_interactions.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
