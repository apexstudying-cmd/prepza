name: B2B contract validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b2b-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest sqlalchemy

      - name: Compile B2B Python modules
        run: |
          python -m py_compile b2b_campaign_metering.py b2b_campaign_payments.py b2b_campaign_finance.py b2b_admin_routes.py b2b_organisation_portal.py discovery_billing.py

      - name: Run B2B contract tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_b2b_contract.py
