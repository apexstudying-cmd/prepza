name: Frontend Build
# Launch gate: prebuild transforms must pass before TypeScript/build verification.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/**'
      - 'tools/apply_generation_ui_build.py'
      - '.github/workflows/frontend-build.yml'

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm run prebuild
          echo '--- APP 6208-6260 ---'
          nl -ba src/App.tsx | sed -n '6208,6260p'
          echo '--- APP 14940-15010 ---'
          nl -ba src/App.tsx | sed -n '14940,15010p'
          echo '--- CHAT 680-688 ---'
          nl -ba src/crypto/WhatsAppChatExperience.tsx | sed -n '680,688p'
          pnpm exec tsc --noEmit

      - name: Validate service worker JavaScript
        run: |
          node --check public/sw.js
          node --check public/sw-register.js

      - name: Build
        run: pnpm run build
