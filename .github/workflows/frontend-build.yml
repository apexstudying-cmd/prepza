name: Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/**'
      - 'tools/apply_generation_ui_build.py'
      - '.github/workflows/frontend-build.yml'

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate service worker JavaScript
        run: |
          node --check public/sw.js
          node --check public/sw-register.js

      - name: Build
        run: npm run build
