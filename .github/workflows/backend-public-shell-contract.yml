name: Backend Public Shell Route Contract

on:
  pull_request:
    paths:
      - 'app.py'
      - 'public_shell_routes.py'
      - 'tests/test_public_shell_routes_contract.py'
      - '.github/workflows/backend-public-shell-contract.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'public_shell_routes.py'
      - 'tests/test_public_shell_routes_contract.py'
      - '.github/workflows/backend-public-shell-contract.yml'

permissions:
  contents: read

jobs:
  public-shell-route-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused route test dependencies
        run: python -m pip install pytest Flask==3.1.3 SQLAlchemy==2.0.51
      - name: Compile the Flask entry point and public shell module
        run: python -m py_compile app.py public_shell_routes.py
      - name: Run public shell route contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_public_shell_routes_contract.py
