name: Build Kokoro A2000 worker image

on:
  push:
    branches:
      - main
    paths:
      - "kokoro_worker/**"
      - "podcast_audio.py"
      - "gpu_lifecycle.py"
      - ".github/workflows/kokoro-worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: kokoro_worker/Dockerfile
          push: true
          tags: |
            ghcr.io/apexstudying-cmd/prepza-kokoro-worker:main
            ghcr.io/apexstudying-cmd/prepza-kokoro-worker:${{ github.sha }}
