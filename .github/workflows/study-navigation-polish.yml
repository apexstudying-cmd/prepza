name: Study navigation polish

on:
  push:
    branches: [fix/study-navigation-polish]

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply polish patch
        run: python3 scripts/apply_study_navigation_polish.py

      - name: Verify deterministic patch
        run: |
          cp frontend/src/App.tsx /tmp/App.after
          python3 scripts/apply_study_navigation_polish.py
          cmp frontend/src/App.tsx /tmp/App.after

      - name: Verify required navigation anchors
        run: |
          grep -F "function MindMapScreen" frontend/src/App.tsx
          grep -F "background: page" frontend/src/App.tsx
          grep -F "const [doc, setDoc] = useState<DocumentDetail | null>(() => activeDocumentId != null ? DOC_CACHE[activeDocumentId] ?? null : null)" frontend/src/App.tsx
          grep -F "window.history.back()" frontend/src/App.tsx
          if grep -F 'Opening your document' frontend/src/App.tsx; then
            echo 'Unexpected legacy document opening loader remains'
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Compile patch script
        run: python3 -m py_compile scripts/apply_study_navigation_polish.py

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx scripts/apply_study_navigation_polish.py .github/workflows/study-navigation-polish.yml
          git commit -m 'fix: polish study navigation and mind map dark mode'
          git push origin HEAD:fix/study-navigation-polish
