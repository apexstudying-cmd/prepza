<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title><!-- figma:title --></title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16233E" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const labels = ['home', 'explore', 'chats', 'profile']
        const labelOf = (button) => `${button.getAttribute('aria-label') || ''} ${button.getAttribute('title') || ''} ${button.textContent || ''}`.trim().toLowerCase()
        const isPrimary = (button) => button instanceof HTMLButtonElement && labels.some(label => labelOf(button).includes(label)) && !!button.querySelector('svg')
        const apply = () => {
          const buttons = Array.from(document.querySelectorAll('button')).filter(isPrimary)
          if (buttons.length < 2) return
          const host = buttons[0].parentElement
          if (!host || buttons.some(button => button.parentElement !== host)) return
          if (getComputedStyle(host).position !== 'fixed') return
          host.style.bottom = 'max(env(safe-area-inset-bottom, 0px), 16px)'
        }
        const observer = new MutationObserver(apply)
        observer.observe(document.getElementById('root') || document.body, { childList: true, subtree: true })
        window.addEventListener('pageshow', apply, { passive: true })
        window.addEventListener('resize', apply, { passive: true })
        apply()
        setTimeout(apply, 250)
        setTimeout(apply, 1000)
      })()
    </script>
    <script defer src="/sw-register.js"></script>
    <!-- figma:body-end -->
  </body>
</html>
