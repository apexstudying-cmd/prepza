    <script>
      // Paint the correct shell color before React/CSS loads to prevent a
      // white/dark flash when returning to the app in a persisted theme.
      (() => {
        try {
          const saved = localStorage.getItem('prepza-theme')
          const dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          const color = dark ? '#0B1437' : '#F8FAFC'
          document.documentElement.style.backgroundColor = color
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.body?.style.setProperty('background-color', color)
        } catch {}
      })()
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Prepza",
        "url": "https://prepza-sf60.onrender.com/",
        "logo": "https://prepza-sf60.onrender.com/icon-512.png",
        "description": "Student study platform with study materials, past papers, AI tutoring and collaborative learning tools."
      }
    </script>
  </head>
