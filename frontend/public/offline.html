<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline - Prepza</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #16233E;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 360px; }
  h1 { font-size: 22px; margin-bottom: 12px; font-weight: 600; }
  p { font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.6; margin-bottom: 20px; }
  button {
    background: #C9A227;
    color: #16233E;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>This page hasn't been saved for offline use yet. Pages you've already visited, and Q&amp;As you've saved, will still work without a connection.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
