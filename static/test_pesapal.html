<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DELETE ME - Pesapal sandbox test</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 18px; color: #8C1D2B; }
  section { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  input, select, button { display: block; width: 100%; margin: 6px 0; padding: 8px; box-sizing: border-box; }
  button { cursor: pointer; background: #16233E; color: white; border: none; border-radius: 4px; }
  button:disabled { opacity: 0.5; cursor: default; }
  pre { background: #f4f4f4; padding: 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  a.redirect-link { display: block; margin-top: 8px; }
</style>
</head>
<body>

<h1>⚠️ TEMPORARY TEST PAGE - delete after use</h1>
<p>This only exists to verify the Chunk 8 Pesapal flow end to end. Not part of the product.</p>

<section>
  <h2>1. Log in</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Log in</button>
  <pre id="loginOut"></pre>
</section>

<section>
  <h2>2. Buy a subscription plan (Pesapal sandbox)</h2>
  <select id="plan">
    <option value="semester">Semester - KES 599</option>
    <option value="annual">Annual - KES 999</option>
  </select>
  <button id="upgradeBtn" disabled>Create Pesapal order</button>
  <pre id="upgradeOut"></pre>
  <a id="redirectLink" class="redirect-link" target="_blank" style="display:none;">Open Pesapal payment page →</a>
</section>

<section>
  <h2>3. Check subscription status</h2>
  <button id="statusBtn" disabled>Refresh status</button>
  <pre id="statusOut"></pre>
</section>

<script>
const BASE = ""; // same-origin - this file must be served from /static/ on the live app
let csrfToken = null;

function show(id, data) {
  document.getElementById(id).textContent =
    typeof data === "string" ? data : JSON.stringify(data, null, 2);
}

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    const loginRes = await fetch(`${BASE}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email, password }),
    });
    const loginData = await loginRes.json();
    if (!loginRes.ok) { show("loginOut", loginData); return; }

    const meRes = await fetch(`${BASE}/me`, { credentials: "include" });
    const meData = await meRes.json();
    csrfToken = meData.csrf_token;

    show("loginOut", { ...loginData, csrf_token_captured: !!csrfToken });
    document.getElementById("upgradeBtn").disabled = false;
    document.getElementById("statusBtn").disabled = false;
  } catch (e) {
    show("loginOut", String(e));
  }
};

document.getElementById("upgradeBtn").onclick = async () => {
  const plan = document.getElementById("plan").value;
  try {
    const res = await fetch(`${BASE}/subscription/upgrade`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRF-Token": csrfToken,
      },
      credentials: "include",
      body: JSON.stringify({ plan }),
    });
    const data = await res.json();
    show("upgradeOut", data);

    const link = document.getElementById("redirectLink");
    if (data.redirect_url) {
      link.href = data.redirect_url;
      link.style.display = "block";
      link.textContent = "Open Pesapal payment page → (complete it, then come back and hit Refresh status)";
    } else {
      link.style.display = "none";
    }
  } catch (e) {
    show("upgradeOut", String(e));
  }
};

document.getElementById("statusBtn").onclick = async () => {
  try {
    const res = await fetch(`${BASE}/subscription/status`, { credentials: "include" });
    show("statusOut", await res.json());
  } catch (e) {
    show("statusOut", String(e));
  }
};
</script>

</body>
</html>
