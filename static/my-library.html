<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#16233E">
<link rel="apple-touch-icon" href="/static/images/icon-192.png">
<script>
(function() {
  var theme = localStorage.getItem('prepza-theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Library - Prepza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16233E;
    --navy-dark: #0F1929;
    --gold: #C9A227;
    --crimson: #8C1D2B;
    --page-bg: #F4F5F7;
    --card-bg: #FFFFFF;
    --border: #E2E4E9;
    --text-primary: #16233E;
    --text-secondary: #5B6478;
    --text-muted: #8B93A3;
  }

  [data-theme="dark"] {
    --navy: #2C3E63;
    --navy-dark: #1B2A47;
    --gold: #D4AF37;
    --crimson: #E0576F;
    --page-bg: #14181F;
    --card-bg: #1E232D;
    --border: #323A48;
    --text-primary: #E8EAED;
    --text-secondary: #A8AFBC;
    --text-muted: #6B7280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--page-bg);
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
  }

  h1, h2, h3, .brand { font-family: 'Space Grotesk', sans-serif; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 240px;
    background: var(--navy);
    border-right: 3px solid var(--gold);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    z-index: 100;
    transition: transform 0.2s ease;
  }
  body.sidebar-collapsed #sidebar {
    transform: translateX(-240px);
  }
  .sidebar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px 20px;
  }
  .brand {
    color: #FFFFFF;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-decoration: none;
  }
  #sidebar-toggle {
    background: transparent;
    border: none;
    color: #FFFFFF;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #menu-toggle {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 101;
    background: var(--navy);
    border: none;
    color: #FFFFFF;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
  }
  body.sidebar-collapsed #menu-toggle {
    display: flex;
  }
  .sidebar-info {
    padding: 0 20px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 12px;
    text-decoration: none;
    cursor: pointer;
  }
  .sidebar-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .sidebar-info-text {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .year-badge {
    background: rgba(201, 162, 39, 0.15);
    color: var(--gold);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
    white-space: nowrap;
    width: fit-content;
  }
  .user-email {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    word-break: break-all;
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 0 12px;
    flex: 1;
  }
  .sidebar-link {
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
  }
  .sidebar-link:hover {
    background: rgba(255,255,255,0.08);
    color: #FFFFFF;
  }
  .sidebar-link.active {
    background: rgba(201, 162, 39, 0.15);
    color: var(--gold);
    font-weight: 500;
  }
  .logout-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    margin: 12px;
  }
  .logout-btn:hover {
    background: rgba(255,255,255,0.08);
  }

  /* ---------- Layout ---------- */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    margin-left: 240px;
    transition: margin-left 0.2s ease;
  }
  body.sidebar-collapsed main {
    margin-left: 0;
  }
  @media (max-width: 720px) {
    #sidebar {
      transform: translateX(-240px);
    }
    body:not(.sidebar-collapsed) #sidebar {
      transform: translateX(0);
    }
    body:not(.sidebar-collapsed) #menu-toggle {
      display: none;
    }
    #menu-toggle {
      display: flex;
    }
    main {
      margin-left: 0;
    }
  }

  .page-title {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .page-sub {
    color: var(--text-secondary);
    font-size: 15px;
    margin-bottom: 36px;
  }

  .section {
    margin-bottom: 36px;
  }

  .section-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
  }

  .content-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .content-row {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .content-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .content-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .content-meta {
    font-size: 12px;
    color: var(--text-muted);
  }

  .unit-tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--navy);
    background: #EDF0F5;
    padding: 3px 8px;
    border-radius: 5px;
    margin-right: 6px;
  }

  [data-theme="dark"] .unit-tag {
    background: rgba(255, 255, 255, 0.08);
  }

  .action-btn {
    flex-shrink: 0;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    white-space: nowrap;
    background: var(--navy);
    color: #FFFFFF;
  }
  .action-btn:hover { background: var(--navy-dark); }

  .empty-note {
    font-size: 13px;
    color: var(--text-muted);
    padding: 12px 0;
  }

  .state-box {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }

  .state-box h3 { font-size: 18px; color: var(--text-primary); margin-bottom: 8px; }
  .state-box p { font-size: 14px; max-width: 380px; margin: 0 auto; line-height: 1.6; }

  .spinner {
    width: 24px; height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<button id="menu-toggle" aria-label="Open menu">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
</button>
<div id="sidebar">
  <div class="sidebar-top">
    <a class="brand" href="/static/dashboard.html">Prepza</a>
    <button id="sidebar-toggle" aria-label="Collapse menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </div>
  <a class="sidebar-info" href="/static/settings.html" title="Edit your profile">
    <div class="sidebar-avatar" id="sidebar-avatar"></div>
    <div class="sidebar-info-text">
      <span class="year-badge" id="year-badge"></span>
      <span class="user-email" id="user-email"></span>
    </div>
  </a>
  <div class="sidebar-nav">
    <a class="sidebar-link" href="/static/dashboard.html">Dashboard</a>
    <a class="sidebar-link active" href="/static/my-library.html">My Library</a>
    <a class="sidebar-link" href="/static/payment-history.html">Payment History</a>
    <a class="sidebar-link" href="/static/settings.html">Settings</a>
  </div>
  <button class="logout-btn" id="logout-btn">Log out</button>
</div>

<main>
  <div id="content">
    <div class="state-box">
      <div class="spinner"></div>
      <p>Loading your library...</p>
    </div>
  </div>
</main>

<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderItem(item, type) {
  const metaParts = [];
  if (item.paper_year) metaParts.push(item.paper_year);

  let actionHtml;
  if (type === 'qna') {
    actionHtml = `<a class="action-btn" href="/static/viewer.html?id=${item.id}">View</a>`;
  } else if (item.file_url) {
    actionHtml = `<a class="action-btn" href="${item.file_url}" target="_blank" rel="noopener">Download</a>`;
  } else {
    actionHtml = `<a class="action-btn" href="/static/unit.html?id=${item.unit_id}">Open unit</a>`;
  }

  return `
    <div class="content-row">
      <div class="content-info">
        <span class="content-title">${item.unit_code ? `<span class="unit-tag">${escapeHtml(item.unit_code)}</span>` : ''}${escapeHtml(item.title)}</span>
        ${metaParts.length ? `<span class="content-meta">${metaParts.map(escapeHtml).join(' &middot; ')}</span>` : ''}
      </div>
      ${actionHtml}
    </div>
  `;
}

function renderGroup(label, items, type) {
  if (!items || items.length === 0) {
    return `
      <div class="section">
        <p class="section-label">${label}</p>
        <p class="empty-note">Nothing here yet - content you unlock will show up in this section.</p>
      </div>
    `;
  }
  return `
    <div class="section">
      <p class="section-label">${label}</p>
      <div class="content-list">
        ${items.map(item => renderItem(item, type)).join('')}
      </div>
    </div>
  `;
}

async function loadLibrary() {
  const contentEl = document.getElementById('content');

  let me;
  try {
    const meRes = await fetch('/me');
    if (meRes.status === 401) {
      window.location.href = '/static/login.html';
      return;
    }
    me = await meRes.json();
  } catch (err) {
    contentEl.innerHTML = `
      <div class="state-box">
        <h3>Couldn't reach Prepza</h3>
        <p>Check your connection and refresh the page.</p>
      </div>`;
    return;
  }

  document.getElementById('user-email').textContent = me.email;
  document.getElementById('year-badge').textContent =
    (me.year && me.semester) ? `Year ${me.year}, Semester ${me.semester}` : 'Set your year and semester';
  (function() {
    var palette = ['#16233E', '#8C1D2B', '#C9A227', '#2C3E63', '#5B6478'];
    var source = (me.display_name && me.display_name.trim()) ? me.display_name.trim() : (me.email || '');
    var initials = '?';
    if (source) {
      var parts = source.split(/\s+/).filter(Boolean);
      initials = (me.display_name && parts.length >= 2) ? (parts[0][0] + parts[1][0]).toUpperCase() : source[0].toUpperCase();
    }
    var str = me.email || '';
    var hash = 0;
    for (var i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
    var color = palette[Math.abs(hash) % palette.length];
    var avatarEl = document.getElementById('sidebar-avatar');
    avatarEl.textContent = initials;
    avatarEl.style.background = color;
  })();

  let data;
  try {
    const res = await fetch('/library');
    if (res.status === 401) {
      window.location.href = '/static/login.html';
      return;
    }
    data = await res.json();
  } catch (err) {
    contentEl.innerHTML = `
      <div class="state-box">
        <h3>Couldn't load your library</h3>
        <p>Refresh the page to try again.</p>
      </div>`;
    return;
  }

  const notes = data.content.notes || [];
  const pastPapers = data.content.past_paper || [];
  const qnas = data.content.qna || [];
  const totalItems = notes.length + pastPapers.length + qnas.length;

  if (totalItems === 0) {
    contentEl.innerHTML = `
      <p class="page-title">My Library</p>
      <p class="page-sub">Everything you've unlocked, in one place.</p>
      <div class="state-box">
        <h3>Your library is empty</h3>
        <p>Once you unlock notes, past papers, or Q&amp;As, they'll show up here.</p>
      </div>`;
    return;
  }

  contentEl.innerHTML = `
    <p class="page-title">My Library</p>
    <p class="page-sub">Everything you've unlocked, in one place - ${totalItems} item${totalItems === 1 ? '' : 's'}.</p>
    ${renderGroup('My Notes', notes, 'notes')}
    ${renderGroup('My Past Papers', pastPapers, 'past_paper')}
    ${renderGroup('My Q&As', qnas, 'qna')}
  `;
}

(function() {
  var collapsed = localStorage.getItem('prepza-sidebar-collapsed') === 'true';
  if (collapsed) document.body.classList.add('sidebar-collapsed');
})();
document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.body.classList.add('sidebar-collapsed');
  localStorage.setItem('prepza-sidebar-collapsed', 'true');
});
document.getElementById('menu-toggle').addEventListener('click', () => {
  document.body.classList.remove('sidebar-collapsed');
  localStorage.setItem('prepza-sidebar-collapsed', 'false');
});
document.querySelectorAll('.sidebar-link').forEach(function(link) {
  link.addEventListener('click', function() {
    if (window.innerWidth <= 720) {
      document.body.classList.add('sidebar-collapsed');
      localStorage.setItem('prepza-sidebar-collapsed', 'true');
    }
  });
});
document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/logout', { method: 'POST' });
  window.location.href = '/static/login.html';
});

loadLibrary();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(err) {
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
