<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function() {
  var theme = localStorage.getItem('prepza-theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Prepza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16233E;
    --navy-dark: #0F1929;
    --gold: #C9A227;
    --crimson: #8C1D2B;
    --page-bg: #F4F5F7;
    --card-bg: #FFFFFF;
    --border: #E2E4E9;
    --text-primary: #16233E;
    --text-secondary: #5B6478;
    --text-muted: #8B93A3;
  }

  [data-theme="dark"] {
    --navy: #2C3E63;
    --navy-dark: #1B2A47;
    --gold: #D4AF37;
    --crimson: #E0576F;
    --page-bg: #14181F;
    --card-bg: #1E232D;
    --border: #323A48;
    --text-primary: #E8EAED;
    --text-secondary: #A8AFBC;
    --text-muted: #6B7280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--page-bg);
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
  }

  h1, h2, h3, .brand {
    font-family: 'Space Grotesk', sans-serif;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 240px;
    background: var(--navy);
    border-right: 3px solid var(--gold);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    z-index: 100;
    transition: transform 0.2s ease;
  }
  body.sidebar-collapsed #sidebar {
    transform: translateX(-240px);
  }
  .sidebar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px 20px;
  }
  .brand {
    color: #FFFFFF;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-decoration: none;
  }
  #sidebar-toggle {
    background: transparent;
    border: none;
    color: #FFFFFF;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #menu-toggle {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 101;
    background: var(--navy);
    border: none;
    color: #FFFFFF;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
  }
  body.sidebar-collapsed #menu-toggle {
    display: flex;
  }
  .sidebar-info {
    padding: 0 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 12px;
  }
  .year-badge {
    background: rgba(201, 162, 39, 0.15);
    color: var(--gold);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
    white-space: nowrap;
    width: fit-content;
  }
  .user-email {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    word-break: break-all;
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 0 12px;
    flex: 1;
  }
  .sidebar-link {
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
  }
  .sidebar-link:hover {
    background: rgba(255,255,255,0.08);
    color: #FFFFFF;
  }
  .sidebar-link.active {
    background: rgba(201, 162, 39, 0.15);
    color: var(--gold);
    font-weight: 500;
  }
  .logout-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    margin: 12px;
  }
  .logout-btn:hover {
    background: rgba(255,255,255,0.08);
  }

  /* ---------- Layout ---------- */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    margin-left: 240px;
    transition: margin-left 0.2s ease;
  }
  body.sidebar-collapsed main {
    margin-left: 0;
  }
  @media (max-width: 720px) {
    #sidebar {
      transform: translateX(-240px);
    }
    body:not(.sidebar-collapsed) #sidebar {
      transform: translateX(0);
    }
    body:not(.sidebar-collapsed) #menu-toggle {
      display: none;
    }
    #menu-toggle {
      display: flex;
    }
    main {
      margin-left: 0;
    }
  }

  h1.page-title {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 32px;
  }

  .settings-layout {
    display: flex;
    gap: 40px;
    align-items: flex-start;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 200px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding-right: 16px;
  }

  .sidebar-tab {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
  }

  .sidebar-tab:hover {
    background: var(--border);
    color: var(--text-primary);
  }

  .sidebar-tab.active {
    background: rgba(201, 162, 39, 0.15);
    color: var(--navy);
    font-weight: 600;
  }

  [data-theme="dark"] .sidebar-tab.active {
    color: var(--gold);
  }

  /* ---------- Content panels ---------- */
  .panel-area {
    flex: 1;
    min-width: 0;
  }

  .panel {
    display: none;
  }

  .panel.active {
    display: block;
  }

  .panel h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .panel-sub {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  /* ---------- Profile form ---------- */
  .field-row {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
  }

  .field {
    flex: 1;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--page-bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }

  .btn-primary {
    background: var(--navy);
    color: #FFFFFF;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
  }

  .btn-primary:hover {
    background: var(--navy-dark);
  }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .btn-danger {
    background: #8C1D2B;
    color: #FFFFFF;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-danger:hover {
    background: #6e1620;
  }
  .btn-danger:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .danger-zone-card {
    border: 1px solid #8C1D2B;
    border-radius: 8px;
    padding: 16px;
  }

  .form-msg {
    font-size: 13px;
    margin-top: 14px;
  }

  .form-msg.success { color: #2E7D4F; }
  .form-msg.error { color: var(--crimson); }

  /* ---------- Appearance toggle ---------- */
  .appearance-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
  }

  .appearance-label-group h3 {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .appearance-label-group p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .theme-switch {
    position: relative;
    width: 46px;
    height: 26px;
    flex-shrink: 0;
  }

  .theme-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .switch-track {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .switch-track::before {
    content: "";
    position: absolute;
    height: 20px;
    width: 20px;
    left: 3px;
    top: 3px;
    background: #FFFFFF;
    border-radius: 50%;
    transition: transform 0.15s ease;
  }

  .theme-switch input:checked + .switch-track {
    background: var(--navy);
  }

  .theme-switch input:checked + .switch-track::before {
    transform: translateX(20px);
  }

  .state-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 24px;
    text-align: center;
    color: var(--text-secondary);
  }

  @media (max-width: 640px) {
    .settings-layout {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding-right: 0;
      padding-bottom: 12px;
      display: flex;
      gap: 6px;
    }
  }
</style>
</head>
<body>

<button id="menu-toggle" aria-label="Open menu">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
</button>
<div id="sidebar">
  <div class="sidebar-top">
    <a class="brand" href="/static/dashboard.html">Prepza</a>
    <button id="sidebar-toggle" aria-label="Collapse menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </div>
  <div class="sidebar-info">
    <span class="year-badge" id="year-badge"></span>
    <span class="user-email" id="user-email"></span>
  </div>
  <div class="sidebar-nav">
    <a class="sidebar-link" href="/static/dashboard.html">Dashboard</a>
    <a class="sidebar-link active" href="/static/settings.html">Settings</a>
  </div>
  <button class="logout-btn" id="logout-btn">Log out</button>
</div>

<main>
  <div id="content">
    <div class="state-box">Loading settings...</div>
  </div>
</main>

<script>
let currentMe = null;

async function loadSettings() {
  const contentEl = document.getElementById('content');

  try {
    const meRes = await fetch('/me');
    if (meRes.status === 401) {
      window.location.href = '/static/login.html';
      return;
    }
    currentMe = await meRes.json();
  } catch (err) {
    contentEl.innerHTML = `<div class="state-box">Couldn't reach Prepza. Check your connection and refresh the page.</div>`;
    return;
  }

  document.getElementById('user-email').textContent = currentMe.email;
  document.getElementById('year-badge').textContent =
    (currentMe.year && currentMe.semester) ? `Year ${currentMe.year}, Semester ${currentMe.semester}` : 'Set your year and semester';

  renderSettings();
}

function renderSettings() {
  const contentEl = document.getElementById('content');
  const currentTheme = localStorage.getItem('prepza-theme') || 'light';

  contentEl.innerHTML = `
    <h1 class="page-title">Settings</h1>
    <div class="settings-layout">
      <div class="sidebar">
        <button class="sidebar-tab active" data-tab="profile">Profile</button>
        <button class="sidebar-tab" data-tab="appearance">Appearance</button>
        <button class="sidebar-tab" data-tab="account">Account</button>
      </div>
      <div class="panel-area">

        <div class="panel active" id="panel-profile">
          <h2>Profile</h2>
          <p class="panel-sub">Update your year and semester. This controls which units and content you see on your dashboard.</p>
          <div class="card">
            <form id="profile-form">
              <div class="field-row">
                <div class="field">
                  <label for="settings-year">Year</label>
                  <select id="settings-year" required>
                    <option value="">Select</option>
                    <option value="1">Year 1</option>
                    <option value="2">Year 2</option>
                    <option value="3">Year 3</option>
                    <option value="4">Year 4</option>
                  </select>
                </div>
                <div class="field">
                  <label for="settings-semester">Semester</label>
                  <select id="settings-semester" required>
                    <option value="">Select</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                  </select>
                </div>
              </div>
              <button type="submit" class="btn-primary" id="profile-submit">Save changes</button>
              <p class="form-msg" id="profile-msg"></p>
            </form>
          </div>
        </div>

        <div class="panel" id="panel-appearance">
          <h2>Appearance</h2>
          <p class="panel-sub">Choose how Prepza looks on this device.</p>
          <div class="card">
            <div class="appearance-row">
              <div class="appearance-label-group">
                <h3>Dark mode</h3>
                <p>Switch between light and dark theme.</p>
              </div>
              <label class="theme-switch">
                <input type="checkbox" id="theme-toggle" ${currentTheme === 'dark' ? 'checked' : ''}>
                <span class="switch-track"></span>
              </label>
            </div>
          </div>
        </div>
        <div class="panel" id="panel-account">
          <h2>Account</h2>
          <p class="panel-sub">Manage your account.</p>
          <div class="card danger-zone-card">
            <h3 style="margin-top:0;">Delete account</h3>
            <p>This permanently deletes your account and all associated data. This cannot be undone.</p>
            <button type="button" class="btn-danger" id="delete-account-btn">Delete my account</button>
            <p class="form-msg" id="delete-account-msg"></p>
          </div>
        </div>

      </div>
    </div>
  `;

  // Pre-fill profile form with current values
  if (currentMe.year) document.getElementById('settings-year').value = String(currentMe.year);
  if (currentMe.semester) document.getElementById('settings-semester').value = String(currentMe.semester);

  // Tab switching
  document.querySelectorAll('.sidebar-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  // Profile form submit
  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const year = parseInt(document.getElementById('settings-year').value, 10);
    const semester = parseInt(document.getElementById('settings-semester').value, 10);
    const msgEl = document.getElementById('profile-msg');
    const submitBtn = document.getElementById('profile-submit');

    msgEl.textContent = '';
    msgEl.className = 'form-msg';

    if (!year || !semester) {
      msgEl.textContent = 'Please select your year and semester.';
      msgEl.className = 'form-msg error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving...';

    try {
      const res = await fetch('/profile', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ year, semester })
      });
      const data = await res.json();

      if (!res.ok) {
        msgEl.textContent = data.error || 'Something went wrong. Please try again.';
        msgEl.className = 'form-msg error';
      } else {
        currentMe.year = data.year;
        currentMe.semester = data.semester;
        msgEl.textContent = 'Saved.';
        msgEl.className = 'form-msg success';
      }
    } catch (err) {
      msgEl.textContent = "Couldn't reach Prepza. Check your connection and try again.";
      msgEl.className = 'form-msg error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save changes';
    }
  });

  // Appearance toggle
  document.getElementById('theme-toggle').addEventListener('change', (e) => {
    const newTheme = e.target.checked ? 'dark' : 'light';
    localStorage.setItem('prepza-theme', newTheme);
    document.documentElement.setAttribute('data-theme', newTheme);
  });
}

(function() {
  var collapsed = localStorage.getItem('prepza-sidebar-collapsed') === 'true';
  if (collapsed) document.body.classList.add('sidebar-collapsed');
})();
document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.body.classList.add('sidebar-collapsed');
  localStorage.setItem('prepza-sidebar-collapsed', 'true');
});
document.getElementById('menu-toggle').addEventListener('click', () => {
  document.body.classList.remove('sidebar-collapsed');
  localStorage.setItem('prepza-sidebar-collapsed', 'false');
});
document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/logout', { method: 'POST' });
  window.location.href = '/static/login.html';
});
document.addEventListener('click', async (e) => {
  if (e.target && e.target.id === 'delete-account-btn') {
    const confirmed = window.confirm('Are you sure you want to permanently delete your account? This cannot be undone.');
    if (!confirmed) return;
    const btn = e.target;
    const msgEl = document.getElementById('delete-account-msg');
    btn.disabled = true;
    btn.textContent = 'Deleting...';
    try {
      const res = await fetch('/delete-account', { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) {
        msgEl.textContent = data.error || 'Something went wrong. Try again.';
        msgEl.className = 'form-msg error';
        btn.disabled = false;
        btn.textContent = 'Delete my account';
        return;
      }
      window.location.href = '/static/login.html';
    } catch (err) {
      msgEl.textContent = 'Could not reach Prepza. Check your connection.';
      msgEl.className = 'form-msg error';
      btn.disabled = false;
      btn.textContent = 'Delete my account';
    }
  }
});

loadSettings();
</script>

</body>
</html>
