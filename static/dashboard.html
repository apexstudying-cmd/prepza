<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function() {
  var theme = localStorage.getItem('prepza-theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Prepza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16233E;
    --navy-dark: #0F1929;
    --gold: #C9A227;
    --crimson: #8C1D2B;
    --page-bg: #F4F5F7;
    --card-bg: #FFFFFF;
    --border: #E2E4E9;
    --text-primary: #16233E;
    --text-secondary: #5B6478;
    --text-muted: #8B93A3;
  }

  [data-theme="dark"] {
    --navy: #2C3E63;
    --navy-dark: #1B2A47;
    --gold: #D4AF37;
    --crimson: #E0576F;
    --page-bg: #14181F;
    --card-bg: #1E232D;
    --border: #323A48;
    --text-primary: #E8EAED;
    --text-secondary: #A8AFBC;
    --text-muted: #6B7280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--page-bg);
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
  }

  h1, h2, h3, .brand {
    font-family: 'Space Grotesk', sans-serif;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 240px;
    background: var(--navy);
    border-right: 3px solid var(--gold);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    z-index: 100;
    transition: transform 0.2s ease;
  }
  body.sidebar-collapsed #sidebar {
    transform: translateX(-240px);
  }
  .sidebar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px 20px;
  }
  .brand {
    color: #FFFFFF;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-decoration: none;
  }
  #sidebar-toggle {
    background: transparent;
    border: none;
    color: #FFFFFF;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #menu-toggle {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 101;
    background: var(--navy);
    border: none;
    color: #FFFFFF;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
  }
  body.sidebar-collapsed #menu-toggle {
    display: flex;
  }
  .sidebar-info {
    padding: 0 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 12px;
  }
  .year-badge {
    background: rgba(201, 162, 39, 0.15);
    color: var(--gold);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
    white-space: nowrap;
    width: fit-content;
  }
  .user-email {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    word-break: break-all;
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 0 12px;
    flex: 1;
  }
  .sidebar-link {
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
  }
  .sidebar-link:hover {
    background: rgba(255,255,255,0.08);
    color: #FFFFFF;
  }
  .sidebar-link.active {
    background: rgba(201, 162, 39, 0.15);
    color: var(--gold);
    font-weight: 500;
  }
  .logout-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    margin: 12px;
  }
  .logout-btn:hover {
    background: rgba(255,255,255,0.08);
  }
  /* ---------- Main content ---------- */
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    margin-left: 240px;
    transition: margin-left 0.2s ease;
  }
  body.sidebar-collapsed main {
    margin-left: 0;
  }
  @media (max-width: 720px) {
    #sidebar {
      transform: translateX(-240px);
    }
    body:not(.sidebar-collapsed) #sidebar {
      transform: translateX(0);
    }
    body:not(.sidebar-collapsed) #menu-toggle {
      display: none;
    }
    #menu-toggle {
      display: flex;
    }
    main {
      margin-left: 0;
    }
  }

  .welcome {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .welcome-sub {
    color: var(--text-secondary);
    font-size: 15px;
    margin-bottom: 36px;
  }

  .section-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }

  .unit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .unit-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .unit-card:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
  }

  .unit-code {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--navy);
    background: #EDF0F5;
    padding: 4px 9px;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  .unit-name {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.4;
  }

  .unit-arrow {
    margin-top: 14px;
    font-size: 13px;
    color: var(--gold);
    font-weight: 500;
  }

  /* ---------- States ---------- */
  .state-box {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }

  .state-box h3 {
    font-size: 18px;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  .state-box p {
    font-size: 14px;
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  [data-theme="dark"] .unit-code {
    background: rgba(255, 255, 255, 0.08);
  }
</style>
</head>
<body>

<button id="menu-toggle" aria-label="Open menu">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
</button>
<div id="sidebar">
  <div class="sidebar-top">
    <a class="brand" href="/static/dashboard.html">Prepza</a>
    <button id="sidebar-toggle" aria-label="Collapse menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </div>
  <div class="sidebar-info">
    <span class="year-badge" id="year-badge"></span>
    <span class="user-email" id="user-email"></span>
  </div>
  <div class="sidebar-nav">
    <a class="sidebar-link active" href="/static/dashboard.html">Dashboard</a>
    <a class="sidebar-link" href="/static/settings.html">Settings</a>
  </div>
  <button class="logout-btn" id="logout-btn">Log out</button>
</div>

<main>
  <div id="content">
    <div class="state-box">
      <div class="spinner"></div>
      <p>Loading your dashboard...</p>
    </div>
  </div>
</main>

<script>
async function loadDashboard() {
  const contentEl = document.getElementById('content');

  let me;
  try {
    const meRes = await fetch('/me');
    if (meRes.status === 401) {
      window.location.href = '/static/login.html';
      return;
    }
    me = await meRes.json();
  } catch (err) {
    contentEl.innerHTML = `
      <div class="state-box">
        <h3>Couldn't reach Prepza</h3>
        <p>Check your connection and refresh the page.</p>
      </div>`;
    return;
  }

  document.getElementById('user-email').textContent = me.email;
  document.getElementById('year-badge').textContent =
    (me.year && me.semester) ? `Year ${me.year}, Semester ${me.semester}` : 'Set your year and semester';

  if (!me.year || !me.semester) {
    contentEl.innerHTML = `
      <div class="state-box">
        <h3>Tell us your year and semester</h3>
        <p>We use this to show you the right units. This will be editable from your profile soon.</p>
      </div>`;
    return;
  }

  let units;
  try {
    const unitsRes = await fetch('/units');
    units = await unitsRes.json();
  } catch (err) {
    contentEl.innerHTML = `
      <div class="state-box">
        <h3>Couldn't load your units</h3>
        <p>Refresh the page to try again.</p>
      </div>`;
    return;
  }

  const firstName = me.email.split('@')[0];

  if (!units || units.length === 0) {
    contentEl.innerHTML = `
      <p class="welcome">Welcome, ${firstName}</p>
      <p class="welcome-sub">Year ${me.year}, Semester ${me.semester}</p>
      <div class="state-box">
        <h3>No units listed yet for your year and semester</h3>
        <p>We're adding content unit by unit. Check back soon, or reach out if a unit you need is missing.</p>
      </div>`;
    return;
  }

  const cardsHtml = units.map(u => `
    <a class="unit-card" href="/static/unit.html?id=${u.id}">
      <span class="unit-code">${escapeHtml(u.code)}</span>
      <div class="unit-name">${escapeHtml(u.name)}</div>
      <div class="unit-arrow">View content &rarr;</div>
    </a>
  `).join('');

  contentEl.innerHTML = `
    <p class="welcome">Welcome, ${escapeHtml(firstName)}</p>
    <p class="welcome-sub">Year ${me.year}, Semester ${me.semester} &middot; ${units.length} unit${units.length === 1 ? '' : 's'} available</p>
    <p class="section-label">Your units</p>
    <div class="unit-grid">${cardsHtml}</div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

(function() {
  var collapsed = localStorage.getItem('prepza-sidebar-collapsed') === 'true';
  if (collapsed) document.body.classList.add('sidebar-collapsed');
})();
document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.body.classList.add('sidebar-collapsed');
  localStorage.setItem('prepza-sidebar-collapsed', 'true');
});
document.getElementById('menu-toggle').addEventListener('click', () => {
  document.body.classList.remove('sidebar-collapsed');
  localStorage.setItem('prepza-sidebar-collapsed', 'false');
});
document.querySelectorAll('.sidebar-link').forEach(function(link) {
  link.addEventListener('click', function() {
    if (window.innerWidth <= 720) {
      document.body.classList.add('sidebar-collapsed');
      localStorage.setItem('prepza-sidebar-collapsed', 'true');
    }
  });
});
document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/logout', { method: 'POST' });
  window.location.href = '/static/login.html';
});

loadDashboard();
</script>

</body>
</html>
